<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub - Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">EventHub</a>
      <div class="nav-links" id="navLinks"></div>
      <span id="userGreeting"></span>
    </div>
  </nav>

  <div class="container">
    <div class="form-wrapper card">
      <h2>Create an Account</h2>

      <div id="messageBox" class="message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Jane Doe" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <p class="form-footer-link">
        Already have an account? <a href="login.html">Log in here</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
